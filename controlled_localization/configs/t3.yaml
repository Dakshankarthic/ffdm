# Controlled Localization v1.1 - T3: T2O + Auxiliary Processing Classifier
variant: "T3"
seed: 42
tile_size: 384
tile_stride: 256
recipes:
  - "identity"
  - "jpeg_q70"
  - "jpeg_q85"
  - "jpeg_q95"
  - "blur_s05"

model:
  pretrained_rgb: true
  weights_name: "IMAGENET1K_V1"
  num_processing_classes: 5
  rgb_only: false

train:
  steps: 5000
  warmup_steps: 100
  ramp_steps: 500
  rgb_lr: 1.0e-4
  new_lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  use_amp: true
  groups_per_step: 2

inference:
  blending_method: "probability"
  pooling_method: "top_k"
  pool_k: 2048
  pool_fraction: 0.01
  t_mask: 0.50
  t_image: 0.7075
  score_direction: "higher_is_fake"

